<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#ffd700" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Avalon" />
    
    <!-- App Info -->
    <title>🏰 Avalon - Juego de Roles</title>
    <meta name="description" content="Juego de cartas de roles épico - Los Caballeros de la Mesa Redonda" />
    
    <!-- Icons -->
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0a0f1c;
            height: 100%;
            width: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        #root {
            height: 100%;
            width: 100%;
            overflow: auto;
        }
        
        /* Selección automática deshabilitada - usar botón clear */
        
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .castle {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .title {
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        
        .subtitle {
            color: #cccccc;
            font-size: 16px;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
<meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div id="splash">
        <div class="castle">🏰</div>
        <div class="title">AVALON</div>
        <div class="subtitle">Cargando el reino...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
        // DESACTIVAR Service Worker temporalmente para forzar actualización
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('🗑️ Service Worker desregistrado');
                }
            });
        }
        
        // Ocultar splash después de cargar
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
            }, 2000);
        });
    </script>
<script src="./static/js/web/AppEntry-216eae20e35ef26f89d03f3d891a1d6c.js?v=1764263329780" defer></script>
</body>
</html>

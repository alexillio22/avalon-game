<html lang="es">
<head>

    <link rel="manifest" href="./manifest-v2.json" />
    <meta name="theme-color" content="#ffd700" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Avalon" />
    
    <!-- App Info -->
    <title>🏰 Avalon - Juego de Roles</title>
    <meta name="description" content="Juego de cartas de roles épico - Los Caballeros de la Mesa Redonda" />
    
    <!-- Icons -->
    <link rel="icon" href="./asesino.png" />
    <link rel="apple-touch-icon" href="./asesino.png" />
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0a0f1c;
            height: 100%;
            width: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        #root {
            height: 100%;
            width: 100%;
            overflow: auto;
        }
        
        /* Selección automática de texto en inputs */
        input[type="text"]:focus {
            user-select: all;
            -webkit-user-select: all;
            -moz-user-select: all;
        }
        
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .castle {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .title {
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        
        .subtitle {
            color: #cccccc;
            font-size: 16px;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
<meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div id="splash">
        <div class="castle">🏰</div>
        <div class="title">AVALON</div>
        <div class="subtitle">Cargando el reino...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
        // 🗑️ DESACTIVAR Service Worker temporalmente para forzar actualización
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('🗑️ Service Worker desregistrado');
                }
            });
        } else {
            console.warn('⚠️ Service Worker no soportado en este navegador');
        }
        
        // Ocultar splash después de cargar
        window.addEventListener('load', () => {
            console.log('🎮 Window loaded, checking React app...');
            setTimeout(() => {
                const root = document.getElementById('root');
                const splash = document.getElementById('splash');
                
                if (root && root.innerHTML.trim()) {
                    console.log('✅ React app loaded successfully');
                    if (splash) splash.style.display = 'none';
                } else {
                    console.error('❌ React app not loaded - root is empty');
                    console.log('Root content:', root ? root.innerHTML : 'root not found');
                }
            }, 3000); // Dar más tiempo para que React se cargue
        });
        
        // Error handler global
        window.addEventListener('error', function(e) {
            console.error('❌ Global error:', e.message, 'at', e.filename + ':' + e.lineno);
        });
    </script>

        console.log('window.expo:', typeof window.expo);
        console.log('window.__EXPO_ENV__:', window.__EXPO_ENV__);
        
        // Verificar si hay errores en el stack

            console.log('✅ ErrorUtils detected (React Native)');
        }
        
        // Debug del Service Worker y cache

            // Verificar cache disponible
            caches.keys().then(cacheNames => {

                    return caches.open(cacheNames[0]);

            }).catch(err => console.warn('⚠️ Error verificando cache:', err));
        }
    }, 4000);
</script>
</body>
</html>

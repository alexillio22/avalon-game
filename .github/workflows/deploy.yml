name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Clear ALL caches and reinstall
      run: |
        rm -rf node_modules
        rm -rf .expo
        rm -rf .expo-shared
        rm -rf dist
        rm -rf web-build
        rm -rf package-lock.json
        rm -rf /tmp/metro-*
        rm -rf /tmp/haste-map-*
        rm -rf /tmp/react-*
        rm -rf ~/.expo
        rm -rf ~/Library/Caches/Expo || true
        find /tmp -name "*metro*" -exec rm -rf {} + 2>/dev/null || true
        find /tmp -name "*haste*" -exec rm -rf {} + 2>/dev/null || true
        echo "🧹 Todas las cachés eliminadas"
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for GitHub Pages
      env:
        EXPO_NO_CACHE: 1
        METRO_CACHE: none
      run: |
        npm run build-github-pages
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: # Si tienes dominio personalizado, ponlo aquí
